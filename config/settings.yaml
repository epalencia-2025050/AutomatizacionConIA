# ==========================================================
# Configuración general - FASE 1: SAT Guatemala
# ==========================================================

sat:
  # Agencia Virtual (login verificado)
  portal_url: "https://portal.sat.gob.gt/portal/"
  # URL DIRECTA del módulo "Consultar DTE" dentro de Agencia Virtual.
  # Dejar vacío: el sistema usará menu_path de selectors.yaml, o mejor,
  # ejecutar tools/discover_dte_selectors.py y pegar aquí la URL observada.
  consulta_dte_url: ""

  dirs:
    downloads: "data/downloads"
    processed: "data/processed"
    errors: "data/errors"
    session: "storage/sat_av_state.json"   # sesión reutilizable (con MFA)

  timeouts:
    default_ms: 15000
    login_ms: 30000
    mfa_s: 180        # tiempo en segundos para que el humano ingrese el código 2FA
    download_ms: 120000

  # Filtros de la consulta de DTE recibidos
  filters:
    tipo_operacion: "Recibidos"   # recibidos | emitidos
    dias_atras_default: 7

processing:
  validar_nit: true      # checksum módulo 11 del NIT

database:
  ruta: "data/automatizacion.db"

destination:
  # ===================== FASE 3 - PENDIENTE DE INTEGRACIÓN =====================
  # La plataforma destino es desconocida. NO llenar hasta conocerla.
  # Cuando esté la URL:
  #   1. habilitado: true
  #   2. url: login completo (ej. https://xx/portal/login)
  #   3. selectors.yaml -> destination.login y destination.envio
  #   4. .env: DEST_USER y DEST_PASSWORD
  habilitado: false
  url: ""
  timeouts:
    login_ms: 30000
    timeout_ms: 20000
  max_intentos: 3
  browser:
    headless: false
    session: "storage/dest_state.json"


run:
  # Se recomienda headful (false): Cloudflare y 2FA funcionan mejor visibles.
  headless: false
  retries: 2
  retry_delay_s: 5
