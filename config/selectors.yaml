# ==========================================================
# Selectores de SAT Guatemala - Agencia Virtual
#
# login.*  ya está VERIFICADO contra el HTML real
#          (https://farm3.sat.gob.gt/menu/login.jsf)
# consulta.* es la pantalla "Consultar DTE" que solo es
#          visible tras iniciar sesión. Selectores marcados
#          "POR CONFIRMAR" son valores genéricos de respaldo;
#          usar tools/discover_dte_selectors.py para aclararlos.
# ==========================================================

login:
  # --- VERIFICADO ---
  username_input: 'input[name="formContent:username"]'
  password_input: 'input[name="formContent:password"]'
  submit_button: 'button[name="formContent:cmdbtnIngresar"]'
  # Segundo factor (Microsoft Authenticator, 6 dígitos)
  mfa_input: 'input[name="formContent:inMaskVerifyCode"]'
  mfa_submit: 'button[name="formContent:cmdbtnVerifyCode"]'
  # Señales de estado
  login_card: '#loginFormulario'                 # visible => aún sin sesión
  mfa_card: '#loginEncabezadoAuth'               # visible => pide código 2FA
  error_selector: '#loginMsgError span.error'

consulta:
  # --- CONFIRMADO contra la pantalla real (nov 2026) ---
  # CONSULTA DE DTE en la portada única JSF: la URL NO cambia al
  # navegar (farm3.sat.gob.gt/menu/portada.jsf) -> no hay URL directa
  # útil; el acceso al formulario es por el menú lateral o manual
  # (el propio flujo lo pide una vez con Enter). Los FILTROS de abajo
  # ya corresponden a los labels visibles del formulario real.
  menu_path:
    - '#btnContraerMenu'                # ☰/✕ toggle del panel lateral (CONFIRMADO)
    - 'text=Servicios Tributarios'      # expande el submenú (flecha >)
    - 'text=Factura Electrónica en Línea'   # columna 2 (CONFIRMADO en captura)
    - 'text=Consultar DTE'              # columna 3 (CONFIRMADO en captura)
  filtros:
    # === CONFIRMADOS contra el DOM real del frame (Angular Material) ===
    # El formulario vive en un iframe (name=iframeContent; url contiene
    # 'dte' o 'felcons') — DOM capturado nov 2026 en tools/.
    tipo_operacion_mat: 'mat-select[name="tipoOperacion"]'
    opcion_operacion: 'mat-option:has-text("Recibidos")'   # overlay del frame o página
    fecha_ini_mat: 'input[name="fechaEmisionIni"]'    # Desde
    fecha_fin_mat: 'input[name="fechaEmisionFinal"]'  # Hasta
    buscar_btn_mat: 'button[type="submit"]:has-text("Buscar")'
    # --- respaldos genéricos si el portal cambia ---
    tipo_operacion: 'select:right-of(:text("Tipo de Operación"), 300), form select'
    # select que lista los candidatos a tipo de operación (para autodetección)
    tipo_candidatos: 'form select'
    # dos campos de fecha de emisión: nth(0)=Desde, nth(1)=Hasta
    fecha_desde: 'input[id*="fecha" i], form input[type="date"], input:right-of(:text("Fecha de Emisión"), 500)'
    fecha_hasta: 'input[id*="fecha" i], form input[type="date"], input:right-of(:text("Fecha de Emisión"), 500)'
    buscar_btn: 'button:has-text("Buscar"), span:has-text("Buscar")'
  resultados:
    tabla: 'mat-table, table'
    filas: 'mat-row, .mat-row, table tbody tr'
    celdas: 'mat-cell, .mat-cell, td'
    # Enlaces de descarga se detectan por texto/título (XML / PDF) en
    # cada fila; la columna MARCA habilita los iconos de exportación
    # (XML, Excel, PDF) de la barra superior.

destination:
  # ==================================================================
  # login (Odoo usa sus selectors estándar, embebidos en
  # src/destination/odoo.py; esta sección es sólo para el modo generico)
  # ==================================================================
  login:
    url: ""
    user_field: ""
    password_field: ""
    submit_button: ""
    error_selector: ""

  envio:
    form_url: ""
    campos: {}
    input_archivo: ""
    guardar_btn: ""
    confirmacion_selector: ""
    verificacion_url: ""
    verificacion_selector: ""

  # ==================================================================
  # odoo: captura de facturas de proveedor (app Contabilidad)
  # POR CONFIRMAR con tools/discover_odoo.py (la UI varía por versión)
  # ==================================================================
  odoo:
    database_field: ""     # sólo self-hosted con varias bases de datos
    envio:
      # Ruta de menú hasta la vista de Facturas de proveedor
      menu_path:
        - 'div.o_ActionMenusContainer >> nth=0'    # hamburguesa apps
        - 'a:has-text("Contabilidad")'
        - 'a:has-text("Facturas de proveedor")'
      crear_btn: 'button.o_list_button_add, button:has-text("Nueva")'
      campos:
        # mapping: columna BD -> selector del input en el form
        # Ej. (a confirmar en tu instancia):
        # nit_emisor: 'div[name="partner_id"] input'
        # numero_documento: 'input[name="ref"]'
        # total: 'input[name="amount_total"]'
      campos_many2one:
        # nit_emisor: true     # campos Many2one: se confirma con Enter
      guardar_btn: 'button.o_form_button_save, button:has-text("Guardar")'
      confirmacion_selector: ''   # señal de validación tras guardar
    adjuntos:
      input_archivo: ''   # adjuntar XML/PDF en el chatter (por confirmar)
  # verificación: URL de búsqueda por referencia = UUID
  # verificacion_url ejemplo Odoo: /accounting/list/... con filtro {uuid}

