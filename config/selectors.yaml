# ==========================================================
# Selectores de SAT Guatemala - Agencia Virtual
#
# login.*  ya está VERIFICADO contra el HTML real
#          (https://farm3.sat.gob.gt/menu/login.jsf)
# consulta.* es la pantalla "Consultar DTE" que solo es
#          visible tras iniciar sesión. Selectores marcados
#          "POR CONFIRMAR" son valores genéricos de respaldo;
#          usar tools/discover_dte_selectors.py para aclararlos.
# ==========================================================

login:
  # --- VERIFICADO ---
  username_input: 'input[name="formContent:username"]'
  password_input: 'input[name="formContent:password"]'
  submit_button: 'button[name="formContent:cmdbtnIngresar"]'
  # Segundo factor (Microsoft Authenticator, 6 dígitos)
  mfa_input: 'input[name="formContent:inMaskVerifyCode"]'
  mfa_submit: 'button[name="formContent:cmdbtnVerifyCode"]'
  # Señales de estado
  login_card: '#loginFormulario'                 # visible => aún sin sesión
  mfa_card: '#loginEncabezadoAuth'               # visible => pide código 2FA
  error_selector: '#loginMsgError span.error'

consulta:
  # --- POR CONFIRMAR (pantalla interna tras login) ---
  # Navegación por menú desde la página inicial de Agencia Virtual.
  # Corregir con tools/discover_dte_selectors.py
  menu_path:
    - 'button:has-text("Menú")'
    - 'text=Servicios Tributarios'
    - 'text=Factura Electrónica en Línea (FEL)'
    - 'text=Consultar DTE'
  filtros:
    # fallbacks genéricos hasta confirmar los IDs reales
    fecha_desde: 'input[id*="fecha" i]'
    fecha_hasta: 'input[id*="fecha" i]'
    tipo_operacion: 'select[id*="operacion" i], select[id*="registro" i]'
    buscar_btn: 'button:has-text("Buscar"), span:has-text("Buscar"), a:has-text("Buscar")'
  resultados:
    tabla: 'table'
    filas: 'table tbody tr'
    # Enlaces/botones de descarga se detectan por texto (XML / PDF / Excel)
    # dentro de cada fila; no requiere selector exacto.

destination:
  # ==================================================================
  # Fase 3 - POR CONFIRMAR contra la página real (NO inventar).
  # Dejar vacío: el sistema lo detecta y NO envía nada (seguro).
  # Instrucciones al conocerse el portal en README sección Fase 3.
  # ==================================================================
  login:
    url: ""            # se lee de settings.yaml/destination/url
    user_field: ""     # ej. 'input[name="usuario"]'
    password_field: "" # ej. 'input[type="password"]'
    submit_button: ""  # ej. 'button[type="submit"]'
    error_selector: "" # alerta/mensaje de credenciales inválidas

  envio:
    form_url: ""       # URL del formulario de nueva factura
    campos:
      # mapping: campo de la BD (columna) -> selector del input
      # uuid: ''
      # nit_emisor: ''
      # numero_documento: ''
      # total: ''
    input_archivo: ""  # 'input[type="file"]'
    guardar_btn: ""    # 'button...' de envío
    confirmacion_selector: ""   # toast/alerta de éxito
    verificacion_url: ""        # URL con búsqueda por UUID: usa {uuid}
    verificacion_selector: ""   # selectores '|'-separados que confirman
